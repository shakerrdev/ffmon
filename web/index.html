<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firefox Monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 17l5-6 4 4 4-7 5 9' fill='none' stroke='%233987e5' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/uPlot.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 17l5-6 4 4 4-7 5 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Firefox Monitor</span>
    </div>
    <span id="live" class="live" title="">connecting…</span>
    <div class="spacer"></div>
    <div class="range" id="range" role="group" aria-label="Time range">
      <button data-r="15m">15m</button><button data-r="1h">1h</button><button data-r="6h">6h</button><button data-r="24h">24h</button><button data-r="3d">3d</button><button data-r="7d">7d</button><button data-r="all">All</button>
    </div>
    <span id="rangeLabel" class="range-label"></span>
    <button id="theme" class="ghost" title="Toggle light/dark">◐</button>
  </header>
  <nav class="views" id="views">
    <button data-v="overview">Overview</button>
    <button data-v="tabs">Tabs</button>
    <button data-v="sites">Sites &amp; processes</button>
    <button data-v="extensions">Extensions</button>
    <button data-v="userscripts">Userscripts</button>
    <button data-v="events">Events &amp; crashes</button>
    <button data-v="setup">Setup</button>
  </nav>
  <main id="main"></main>
  <div id="tip" class="tip" hidden></div>
  <aside id="drawer" class="drawer" hidden></aside>
</div>
<script src="vendor/uPlot.iife.min.js"></script>
<script src="app.js"></script>
</body>
</html>
